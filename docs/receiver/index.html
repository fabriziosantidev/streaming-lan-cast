<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streaming LAN Cast Receiver</title>
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #14161a; overflow: hidden; }
  /* Native player (Shaka) so the TV remote, phone and Google Home controls and BACK/exit all work
     (CAFv3 drives these through its own player). shakaConfig keeps playback tolerant of the source's
     segment gaps and stalls (retries / stall-skip / gap-jump / deep buffer). */
  cast-media-player {
    --splash-image: url('icon-256.png');
    --splash-size: 132px;
    --background-color: #14161a;
    --progress-color: #e30f0f;
    --title-color: #ffffff;
    --theme-hue: 220;
  }
  /* Branded loading screen. CAF's own --splash-image only shows in the idle state, not during the gap
     while a stream is still loading, so show our logo over that gap and hide it once playback starts. */
  #splash {
    position: fixed; inset: 0; z-index: 20; background: #14161a;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
  }
  #splash img { width: 168px; height: 168px; }
  #splash .nm { color: #e6e6e6; font: 600 30px/1 system-ui, sans-serif; }
  #splash.gone { display: none; }
  /* Held-seek marker riding above the scrubber: where the seek has reached, and one arrow per step.
     It carries its own time because the player's controls fade to a bare bar while a seek runs. */
  #spd { position: fixed; z-index: 15; transform: translate(-50%, -100%);
         display: flex; align-items: baseline; gap: 10px; white-space: nowrap;
         padding: 6px 12px; border-radius: 10px; background: rgba(0,0,0,.72);
         text-shadow: 0 1px 4px rgba(0,0,0,.85);
         opacity: 0; transition: opacity .15s; pointer-events: none; }
  #spd.on { opacity: .95; }
  #spdT { color: #fff; font: 600 24px/1 system-ui, sans-serif; }
  #spdA { color: #e30f0f; font: 700 22px/1 system-ui, sans-serif; letter-spacing: 2px; }
</style>
</head>
<body>
  <cast-media-player></cast-media-player>
  <div id="splash"><img src="icon-256.png" alt=""><div class="nm">Streaming LAN Cast</div></div>
  <div id="spd"><span id="spdT"></span><span id="spdA"></span></div>
  <script>
    const NS = 'urn:x-cast:slc';
    const RX_VERSION = '1.29';
    const stats = { stalls: 0, lastError: null };
    // Budget for the startup nudge below, held here so the load interceptor can refill it without
    // reaching forward to a declaration that has not run yet.
    const nudge = { left: 3, prevT: -1, at: 0 };
    let tcMode = false;   // the current source is the helper's on-the-fly transcode (tc=1)

    // Capture each MSE SourceBuffer as the player creates it, so the seek recovery below can tell
    // whether audio and video separately cover a seek target (the media element's .buffered only
    // exposes their intersection).
    const sbs = [];
    const _addSB = MediaSource.prototype.addSourceBuffer;
    MediaSource.prototype.addSourceBuffer = function (mime) {
      const sb = _addSB.call(this, mime);
      sbs.push({ k: /audio/i.test(mime) ? 'a' : (/video/i.test(mime) ? 'v' : '?'), sb });
      return sb;
    };

    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();
    const splash = document.getElementById('splash');   // branded loading overlay (hidden once playing)

    // Tolerant Shaka config: survive the source's segment 404s, stalls and discontinuities.
    // Merged over CAF's Shaka defaults.
    const playbackConfig = new cast.framework.PlaybackConfig();
    playbackConfig.segmentRequestRetryLimit = 10;     // don't give up on a 404'd segment after 3
    playbackConfig.autoResumeDuration = 2;            // resume quickly after an auto-pause
    playbackConfig.autoResumeNumberOfSegments = 1;
    playbackConfig.shakaConfig = {
      streaming: {
        retryParameters: { maxAttempts: 8, baseDelay: 400, backoffFactor: 1.5, fuzzFactor: 0.5,
                           timeout: 9000, stallTimeout: 5000, connectionTimeout: 6000 },
        bufferingGoal: 30,          // buffer deep so bursty delivery + stalls don't starve playback
        rebufferingGoal: 2,
        bufferBehind: 30,
        stallEnabled: true,         // detect a frozen playhead...
        stallThreshold: 1,
        stallSkip: 0.1,             // ...and nudge across it (crosses small PTS holes)
        gapDetectionThreshold: 0.5, // jump gaps left by dropped segments
        ignoreTextStreamFailures: true,
      },
      manifest: {
        retryParameters: { maxAttempts: 8, baseDelay: 400, backoffFactor: 1.5, timeout: 9000 },
        defaultPresentationDelay: 10,   // sit ~10s behind live (stable, not the raw edge)
      },
    };

    // LOAD: a direct media file (video/*, served with byte-range seeking) or a VOD HLS (tagged ?vod=1)
    // plays as a seekable BUFFERED stream; a live source stays LIVE. Headers/token are injected by the
    // helper's proxy, so the player just fetches our CORS-enabled proxy - no per-request auth here.
    playerManager.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, (req) => {
      try {
        const m = req.media || {};
        sbs.length = 0;                    // new load -> new MediaSource; drop the old SourceBuffers
        m.contentUrl = m.contentUrl || m.contentId;   // pychromecast sets contentId; the player loads contentUrl
        const url = m.contentUrl || '';
        const path = url.split('?')[0];
        // Show the loading logo for a fresh cast only. A LOAD tagged sw=1 swaps the source of a cast
        // already on screen (a rewind, or a recovery), where the logo would turn a short gap into a
        // full restart cue.
        if (url.indexOf('sw=1') === -1) splash.classList.remove('gone');
        // A direct file plays through CAF's own player; an HLS playlist plays through Shaka. contentType
        // picks which.
        if (path.endsWith('.webm')) m.contentType = 'video/webm';
        else if (path.endsWith('.mp4') || path.endsWith('.m4v') || path.endsWith('.mov')) m.contentType = 'video/mp4';
        else if (path.endsWith('.mpd')) m.contentType = 'application/dash+xml';
        else m.contentType = 'application/x-mpegurl';
        const isVod = url.indexOf('vod=1') !== -1;
        m.streamType = isVod ? cast.framework.messages.StreamType.BUFFERED
                             : cast.framework.messages.StreamType.LIVE;
        // Let Shaka autodetect the segment format (don't force hlsSegmentFormat).
        // A live HLS tagged ll=1 (Twitch/Kick/YouTube) rides closer to the edge with a shallower buffer;
        // a VOD seeks freely and has no live edge, so it drops the presentation delay.
        const lowLat = url.indexOf('ll=1') !== -1;
        playbackConfig.shakaConfig.manifest.defaultPresentationDelay = isVod ? 0 : (lowLat ? 3 : 14);
        playbackConfig.shakaConfig.streaming.bufferingGoal = (lowLat && !isVod) ? 12 : 30;
        // resume on a thin buffer for a stable/ll live (snappy); wait for a deeper cushion on a flaky
        // non-ll live so a bursty CDN doesn't loop stall-resume-stall
        playbackConfig.shakaConfig.streaming.rebufferingGoal = isVod ? 2 : (lowLat ? 1 : 4);
        // Low-latency HLS: fetch the sub-second #EXT-X-PART parts and ride the edge with blocking reloads.
        // Some hosts deliver ALL media through the parts (the full #EXTINF segments are empty markers), so
        // without this Shaka fetches empty segments and never fills its buffer.
        playbackConfig.shakaConfig.streaming.lowLatencyMode = lowLat && !isVod;
        // A locally transcoded source (tc=1) produces segments on the fly and its server holds a
        // request open until the segment exists; give those requests time to be answered instead of
        // aborting at the 5s no-bytes stall cutoff and re-firing each track on its own clock (tracks
        // then join MSE far apart, which desyncs some TVs).
        const isTc = url.indexOf('tc=1') !== -1;
        tcMode = isTc;
        playbackConfig.shakaConfig.streaming.retryParameters.timeout = isTc ? 50000 : 9000;
        playbackConfig.shakaConfig.streaming.retryParameters.stallTimeout = isTc ? 0 : 5000;
        stats.lastError = 'loading:' + url.slice(0, 40);
        nudge.left = 3; nudge.prevT = -1; nudge.at = 0;
      } catch (e) { stats.lastError = 'load-intercept/' + e.message; }
      return req;
    });

    // telemetry so the helper log shows whether Shaka plays or chokes (and why)
    const EV = cast.framework.events.EventType;
    // Name whatever fields an object actually carries. CAF nests the underlying player error under
    // several shapes, so reading fixed keys off it reports nothing; listing the keys that are there
    // shows what was rejected (network / manifest / media / codec) whichever shape arrived.
    function describe(o, depth) {
      if (o == null || typeof o !== 'object') return String(o).slice(0, 48);
      const out = [];
      for (const k of Object.keys(o).slice(0, 8)) {
        const v = o[k];
        if (v == null || typeof v === 'function') continue;
        out.push(k + '=' + (typeof v === 'object' ? (depth > 0 ? describe(v, depth - 1) : '{}')
                                                  : String(v).slice(0, 32)));
      }
      return '{' + out.join(' ') + '}';
    }
    playerManager.addEventListener(EV.ERROR, (e) => {
      let d = 'shaka/' + (e && e.detailedErrorCode);
      try {
        if (e && e.reason != null) d += ' reason=' + e.reason;
        const er = e && (e.error || (e.errorInfo && e.errorInfo.error));
        if (er) d += ' err=' + describe(er, 1);
        // the media element keeps its own error, which survives when the event carries none
        const v = mediaEl();
        if (v && v.error) d += ' media=' + v.error.code + '/' + String(v.error.message || '').slice(0, 32);
      } catch (x) { d += ' describe/' + x.message; }
      stats.lastError = d.slice(0, 200);
    });
    playerManager.addEventListener(EV.BUFFERING, () => { stats.stalls++; });
    playerManager.addEventListener(EV.PLAYING, () => splash.classList.add('gone'));   // hide the loading logo once playback starts

    // The media element lives inside <cast-media-player>'s shadow root, so a plain tag lookup finds
    // nothing. Pierce the shadow root to hook it and to read its position/buffer for the status telemetry.
    function mediaEl() {
      let v = document.getElementsByTagName('video')[0];
      if (!v) {
        const p = document.querySelector('cast-media-player');
        if (p && p.shadowRoot) v = p.shadowRoot.querySelector('video, audio');
      }
      return v;
    }
    let hooked = null;
    function sbCovers(kind, t, lead) {
      for (const x of sbs) {
        if (x.k !== kind) continue;
        try {
          const b = x.sb.buffered;
          for (let i = 0; i < b.length; i++) if (t >= b.start(i) && t + lead <= b.end(i)) return true;
        } catch (e) {}
      }
      return false;
    }
    function splitTracks() {
      let a = false, v = false;
      for (const x of sbs) { if (x.k === 'a') a = true; else if (x.k === 'v') v = true; }
      return a && v;
    }
    function bufferedCovers(t) {
      for (const x of sbs) {
        try {
          const b = x.sb.buffered;
          for (let i = 0; i < b.length; i++) if (t >= b.start(i) && t < b.end(i)) return true;
        } catch (e) {}
      }
      return false;
    }
    // A seek INTO buffered content latches this TV's audio/video render clocks correctly; a seek
    // OUTSIDE the buffer (tracks streaming in while the element waits) latches them apart even though
    // the appended data is aligned. So turn every unbuffered seek into a buffered one: hold the
    // element paused, wait until BOTH tracks cover the target, then re-seek into the buffer and play.
    // Two SourceBuffers are what makes that possible. A muxed buffer carries one clock for both
    // tracks, so the hold is skipped there; it would only add a wait.
    let fix = null;   // { own, iv } - the pending unbuffered-seek recovery
    function cancelFix() { if (fix) { clearInterval(fix.iv); fix = null; } }
    function hookMedia(v) {
      if (!v || hooked === v) return;
      hooked = v;
      v.addEventListener('seeking', () => {
        if (fix && fix.own && Math.abs(v.currentTime - fix.own) < 0.5) return;   // our corrective hop
        // A hold in flight is itself what paused the element, so its captured flag is the only record
        // of whether the viewer had this playing; carry that forward rather than reading back the
        // pause we made. Whatever ends a hold owes playback its state back, early returns included.
        // An element that has not started yet also reads as paused, which is how the opening seek to
        // a live edge arrives, so a played range is what marks a pause as the viewer's.
        let everPlayed = false;
        try { everPlayed = v.played.length > 0; } catch (e) {}
        const wasPaused = fix ? fix.wasPaused : (v.paused && everPlayed);
        const resume = fix && !wasPaused ? () => { try { v.play(); } catch (e) {} } : () => {};
        cancelFix();
        // Any source fed through MSE, not only a locally transcoded one, can land with its two tracks
        // covering different ranges, which plays as audio adrift from the picture. A progressive file
        // creates no SourceBuffers and is seeked by the player against its own buffer, so it is left
        // alone. A held seek steps every few hundred ms, and settling on each step would fight the
        // gesture, so wait until it ends; the nudge in tryAcceleratedSeek brings us back here then.
        if (!splitTracks()) return resume();
        if (Date.now() - lastSeekKey < SEEK_END) return resume();
        if (bufferedCovers(v.currentTime)) return resume();
        const target = v.currentTime;
        const t0 = Date.now();
        try { v.pause(); } catch (e) {}
        fix = { own: 0, wasPaused, at: t0 };
        fix.iv = setInterval(() => {
          const room = (v.duration || 0) - target - 0.3;   // 0 for an unknown duration, so: floor
          const lead = room > 0 ? Math.max(0.4, Math.min(1.5, room)) : 0.4;
          if (sbCovers('v', target, lead) && sbCovers('a', target, lead)) {
            clearInterval(fix.iv);
            fix.own = target + 0.001;
            try { v.currentTime = fix.own; } catch (e) {}
            if (!wasPaused) { try { v.play(); } catch (e) {} }
            setTimeout(cancelFix, 3000);
          } else if (Date.now() - t0 > 6000) {
            cancelFix();
            if (!wasPaused) { try { v.play(); } catch (e) {} }
          }
        }, 250);
      });
      v.addEventListener('playing', () => {
        // The player auto-resumes off its own buffering state right after the hold pauses it, which
        // would defeat the hold; a play arriving later than that is the viewer's, and it wins.
        if (fix && !fix.own && Date.now() - fix.at < 2000) { try { v.pause(); } catch (e) {} }
        else if (fix && !fix.own) cancelFix();
      });
      // Report a backward playhead jump the moment it happens. timeupdate ticks ~4x a second for
      // free, so this catches what the 2s status samples can slide past, and it costs nothing while
      // playback moves forward. One message per jump, never a stream of them.
      let lastT = 0;
      v.addEventListener('timeupdate', () => {
        const t = v.currentTime;
        if (lastT && t < lastT - 0.5) {
          try { context.sendCustomMessage(NS, undefined, { type: 'tjump', ver: RX_VERSION,
            from: Math.round(lastT * 10) / 10, to: Math.round(t * 10) / 10 }); } catch (e) {}
        }
        lastT = t;
      });
    }
    setInterval(() => {
      const v = mediaEl();
      hookMedia(v);
      let st = 'idle', t = 0, buf = 0, cov = null, b0 = null;
      try { st = (playerManager.getPlayerState() || 'IDLE').toLowerCase(); } catch (e) {}
      if (v) {
        t = Math.round(v.currentTime * 10) / 10;
        // buf reaches to the end of the last range, which holds whether or not the playhead is inside
        // one: a playhead parked in a gap ahead of the media reads as a deep buffer that never plays.
        // cov says whether the playhead sits in buffered content, b0 where the content starts.
        try {
          const b = v.buffered;
          if (b.length) {
            buf = Math.round((b.end(b.length - 1) - v.currentTime) * 10) / 10;
            b0 = Math.round(b.start(0) * 10) / 10;
            cov = false;
            for (let i = 0; i < b.length; i++) {
              if (v.currentTime >= b.start(i) && v.currentTime < b.end(i)) cov = true;
            }
          }
        } catch (e) {}
      }
      if (st === 'playing') splash.classList.add('gone');   // fallback hide (in case the PLAYING event was missed)
      try { context.sendCustomMessage(NS, undefined, { type: 'status', state: st, t, buf, cov, b0,
        stalls: stats.stalls | 0, ver: RX_VERSION, err: stats.lastError || null }); } catch (e) {}
    }, 2000);

    // A cast can settle with the playhead on the first buffered sample and never start: the element
    // sits at a position the decoder has nothing to render at, so it waits while the buffer behind it
    // keeps filling. A small step into the buffer starts it. Every load can land that way, a swap to
    // another source and a recovery reload included, so the budget refills whenever one begins.
    // A viewer's own pause is the one state left alone: pausing takes a playback to pause, so a
    // paused element that has played is theirs, while one that is not paused and still will not move
    // is waiting on nothing.
    setInterval(() => {
      const v = mediaEl();
      if (!v || nudge.left <= 0) return;
      let played = 0;
      try { played = v.played.length; } catch (e) {}
      if (v.paused && played) return;
      let ahead = 0;
      try {
        const b = v.buffered;
        for (let i = 0; i < b.length; i++) {
          if (v.currentTime >= b.start(i) - 0.1 && v.currentTime < b.end(i)) ahead = b.end(i) - v.currentTime;
        }
      } catch (e) {}
      const t = v.currentTime;
      if (ahead < 1 || t !== nudge.prevT) { nudge.prevT = t; nudge.at = Date.now(); return; }
      if (Date.now() - nudge.at < 4000) return;
      nudge.left--;
      nudge.at = Date.now();
      try { v.currentTime = t + 0.3; } catch (e) {}
      try { v.play(); } catch (e) {}
    }, 1000);

    // Skipping through a long recording. The remote's key auto-repeat fires far faster than a person
    // can judge, so the jump runs on a clock of its own instead of once per repeat, and the step grows
    // the longer the key stays down, falling back to the smallest once it is released. Only for a
    // finite, seekable stream long enough to need it; a short piece and a live edge keep the player's
    // own behaviour.
    const SEEK_STEPS = [10, 30, 60, 300];  // seconds per tick, by how long the key has been held
    const SEEK_TIERS = [3000, 6000, 9000]; // ms held before each next step takes over
    const SEEK_TICK = 400;                 // how often a held key moves the playhead
    const SEEK_END = 700;                  // no key for this long ends the gesture, so it starts small again
    let holdFrom = 0, lastSeekKey = 0, lastTick = 0, spdHide = 0, settleTimer = 0;
    const spdEl = document.getElementById('spd');
    const spdT = document.getElementById('spdT');
    const spdA = document.getElementById('spdA');
    function hms(sec) {
      sec = Math.max(0, Math.floor(sec));
      const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = sec % 60;
      return h ? h + 'h ' + m + 'm ' + x + 's' : m ? m + 'm ' + x + 's' : x + 's';
    }

    function seekKeyDir(e) {
      const k = (e.key || '').toLowerCase();
      if (k === 'mediafastforward' || k === 'arrowright' || e.keyCode === 417 || e.keyCode === 39) return 1;
      if (k === 'mediarewind' || k === 'arrowleft' || e.keyCode === 412 || e.keyCode === 37) return -1;
      return 0;
    }
    // The player shows its controls for any key it handles; the seek keys are taken before they get
    // there, so hand it one it does nothing with, which still counts as activity and brings them up.
    function wakeControls() {
      try {
        const el = document.querySelector('cast-media-player') || window;
        el.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowUp', keyCode: 38, bubbles: true }));
      } catch (x) {}
    }
    // The progress bar lives in the player's shadow root, so find it by shape rather than by a class
    // name that is not ours to rely on: the widest short box in the lower part of the screen.
    let barBox = null, barAt = 0;
    function scrubberRect() {
      const now = Date.now();
      if (barBox && now - barAt < 1000) return barBox;
      const host = document.querySelector('cast-media-player');
      const root = host && host.shadowRoot;
      if (!root) return null;
      const W = innerWidth || 0, H = innerHeight || 0;
      if (!W || !H) return null;
      let best = null;
      for (const el of root.querySelectorAll('*')) {
        const b = el.getBoundingClientRect();
        if (b.width > W * 0.4 && b.height > 0 && b.height < 30 && b.top > H * 0.5) {
          if (!best || b.width > best.width || (b.width === best.width && b.top > best.top)) best = b;
        }
      }
      barBox = best; barAt = now;
      return best;
    }
    function showSpeed(tier, frac, at, dir) {
      // Ride the player's scrubber when it can be located. Its markup is not ours, so when the shape
      // search comes up empty the marks still appear, over the strip the bar occupies.
      const b = scrubberRect();
      const W = innerWidth || 1280, H = innerHeight || 720;
      const box = b && b.width > 0 ? b : { left: W * 0.06, width: W * 0.88, top: H - 86 };
      frac = Math.min(1, Math.max(0, frac || 0));
      spdT.textContent = hms(at);
      spdA.textContent = (dir < 0 ? '\u25c2' : '\u25b8').repeat(tier);
      spdEl.style.left = Math.round(box.left + box.width * frac) + 'px';
      spdEl.style.top = Math.round(box.top - 6) + 'px';
      spdEl.classList.add('on');
      clearTimeout(spdHide);
      spdHide = setTimeout(() => spdEl.classList.remove('on'), 1200);
    }
    function tryAcceleratedSeek(e) {
      const dir = seekKeyDir(e);
      if (!dir) return false;
      const v = mediaEl();
      const dur = v && v.duration;
      if (!v || !isFinite(dur) || dur < 600) return false;   // short or live: leave the player alone
      const now = Date.now();
      if (now - lastSeekKey > SEEK_END) { holdFrom = now; lastTick = 0; }   // a fresh press starts small
      lastSeekKey = now;
      if (now - lastTick >= SEEK_TICK) {
        lastTick = now;
        const held = now - holdFrom;
        let tier = 1;                      // one step per threshold passed, so the list sets the pace
        while (tier < SEEK_STEPS.length && held >= SEEK_TIERS[tier - 1]) tier++;
        const target = Math.min(Math.max(0, v.currentTime + dir * SEEK_STEPS[tier - 1]),
                                Math.max(0, dur - 5));
        // Seek through the player, not the media element: its own clock, scrubber and time readout
        // follow what it was told to do, and a raw element write leaves all three behind.
        try { playerManager.seek(target); } catch (x) {
          try { v.currentTime = target; } catch (y) {}
        }
        wakeControls();
        showSpeed(tier, target / dur, target, dir);
        // Once the gesture is over, a hair's move re-fires seeking with no gesture in flight, which
        // is what runs the track alignment above on where the seek actually settled.
        clearTimeout(settleTimer);
        settleTimer = setTimeout(() => {
          const el = mediaEl();
          if (el && splitTracks()) { try { el.currentTime = el.currentTime + 0.001; } catch (x) {} }
        }, SEEK_END + 60);
      }
      e.preventDefault(); e.stopPropagation();
      return true;
    }

    // BACK button. The numeric keyCode for "back" isn't consistent across Cast platforms, so match the
    // portable event.key name first (Chromecast / Google TV report 'BrowserBack') and fall back to the
    // known TV back codes: 166 (legacy BrowserBack), 461 (HbbTV / most TV browsers), 10009 (Tizen).
    // Some Android TV / Google TV builds handle BACK in the system and close the app before this runs.
    function isBackKey(e) {
      const key = (e.key || '').toLowerCase();
      if (key === 'browserback' || key === 'goback' || key === 'back') return true;
      return e.keyCode === 166 || e.keyCode === 461 || e.keyCode === 10009;
    }

    // With the player controls visible, a back press just hides them (CAF's default); with them already
    // hidden it exits. CAF shows the controls on any remote key and auto-hides them a few seconds later,
    // so "time since the last key" stands in for the controls being visible. Capture phase, so this runs
    // before <cast-media-player> consumes the key.
    let lastKeyAt = 0;
    window.addEventListener('keydown', (e) => {
      const controlsVisible = (Date.now() - lastKeyAt) < 4500;
      if (tryAcceleratedSeek(e)) { lastKeyAt = Date.now(); return; }
      if (isBackKey(e)) {
        if (controlsVisible) {
          lastKeyAt = 0;                           // controls hide now; a later BACK (hidden) will exit
        } else {
          e.preventDefault(); e.stopPropagation();
          try { context.stop(); } catch (x) {}     // controls already hidden -> exit the receiver
        }
      } else {
        lastKeyAt = Date.now();                    // any other remote key shows the controls
      }
    }, true);

    const options = new cast.framework.CastReceiverOptions();
    options.useShakaForHls = true;   // play HLS with Shaka (not CAF's legacy player) so the tolerant
                                     // shakaConfig above applies and the native controls work.
    options.playbackConfig = playbackConfig;
    options.customNamespaces = { [NS]: cast.framework.system.MessageType.JSON };
    options.maxInactivity = 3600;
    context.start(options);
  </script>
</body>
